[package]
name = "junie-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Junie-inspired Ratatui design-system laboratory"
license = "MIT"

default-run = "showcase"

[workspace]
members = [".", "apps/jackin"]
default-members = [".", "apps/jackin"]

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
ratatui = { version = "0.30", features = ["crossterm_0_29"] }
serde_json = "1"
tui-test = { package = "tuiscotti-tui-test", version = "=0.2.1" }
tuiscotti-latest = { package = "tuiscotti", git = "https://github.com/tailrocks/tuiscotti", rev = "d8d54155947f6303a41dfd6079b53c0abc16f29a" }

[features]
default = ["cli", "terminal"]
cli = ["dep:clap"]
terminal = ["dep:termpane"]

[lib]
name = "junie_tui"
path = "src/lib.rs"

doctest = false

[[bin]]
name = "showcase"
path = "src/bin/showcase/main.rs"
required-features = ["cli", "terminal"]

[[bin]]
name = "tablepro"
path = "src/bin/tablepro/main.rs"
required-features = ["cli"]

[[bin]]
name = "holla"
path = "src/bin/holla/main.rs"
required-features = ["cli"]

[[test]]
name = "functional"
path = "tests/functional/main.rs"

[dependencies]
clap = { workspace = true, optional = true }
termpane = { git = "https://github.com/tailrocks/termpane", rev = "0707acca3cbf3333d4c1b0e6d88b7b69169233dc", optional = true, default-features = false }
ratatui = { workspace = true }
unicode-width = "0.2"
unicode-segmentation = "1"

[target.'cfg(unix)'.dependencies]

libc = "0.2"

[dev-dependencies]

tui-test = { workspace = true }

tuiscotti-latest = { workspace = true }
serde_json = { workspace = true }

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
