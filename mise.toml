min_version = { hard = "2026.11.1", soft = "2026.11.1" }

[tools]
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.151"
actionlint = "1.7.12"
shellcheck = "0.11.0"
zizmor = "1.32.0"
jactionlint = "2.4.0"
gh = "2.103.3"
hk = "2.11.1"
"github:tailrocks/velnor-new" = { version = "0.1.74", bin = "velnor-actions" }
"cargo:https://github.com/tailrocks/tuiscotti" = { version = "rev:92ef2d9ee082b35f68e066c5129fedbf07675a80", crate = "tuiscotti-cli" }
mr-boxington = { version = "1.29.2", postinstall = "mbx setup --yes" }
rust = { version = "1.99.1", profile = "minimal", components = [
  "clippy",
  "rustfmt",
], targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
], mr_boxington = true }

[settings]
cargo.binstall = true
idiomatic_version_file_enable_tools = ["rust"]
lockfile = true

[wrappers.cargo]
command = "mbx"
env = { MBX_CARGO_SHIM_MODE = "1" }
