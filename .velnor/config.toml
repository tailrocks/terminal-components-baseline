schema = 1

[workflow]
policy = "consumer-v1"

default_branch = "design/interaction-polish"

runner_label = "ubuntu-26.04"
crate_timeout_minutes = 15

plan_timeout_minutes = 15

[stacks.rust]

compile_driver = "mbx"

test_runner = "cargo_nextest"

run_ignored = "default"

# Eight hash shards run concurrently. The functional suite uses PTYs,
# so eight test threads fill the runner's eight PTY slots.
allow_empty_test_suite = true

[discovery]

exclude = ["docs/**"]

[agents]

claude_md = "symlink"

[workflow.dispatch.inputs.tier]
type = "choice"
description = "Test tier (docs/functional-testing.md)"
default = "functional"
options = ["functional"]

[[stacks.rust.suites]]
id = "functional"
profile = "functional"
run_ignored = "default"
partitions = 8
build = "inline"
timeout_minutes = 15
test_threads = 8
triggers = ["pull_request", "push", "workflow_dispatch"]
required = true
dispatch_inputs = { tier = ["functional"] }
artifacts = [{ name = "functional-terminal-evidence", paths = ["target/functional", "target/nextest/functional"], when = "always", retention_days = 14 }]

[[stacks.rust.configurations]]
name = "default"
features = ["default"]
all_features = true
target = "host"

[[stacks.rust.configurations]]
name = "product"
features = ["product"]
target = "host"

[[workflow.tasks]]
id = "baseline-linux-guard"
kind = "verification"
mise_task = "check:baseline-linux-guard"
runner = "linux-x64"
timeout_minutes = 180

[workflow.tasks.source]
mise_config = ".velnor/guard/mise.toml"
working_directory = ".velnor/guard"
