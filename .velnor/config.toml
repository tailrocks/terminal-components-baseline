schema = 1

[workflow]
policy = "consumer-v1"

default_branch = "design/interaction-polish"

runner_label = "ubuntu-26.04"
crate_timeout_minutes = 15

plan_timeout_minutes = 15

[stacks.rust]

compile_driver = "mbx"

test_runner = "cargo_nextest"

run_ignored = "default"

# Profile ci excludes binary(functional), and that binary is the only
# one that contains tests. Run 41783685777 then reported 0 tests and
# nextest exited 4. The suite job owns those tests.
allow_empty_test_suite = true

[discovery]

exclude = ["docs/**"]

[agents]

claude_md = "symlink"

[workflow.dispatch.inputs.tier]
type = "choice"
description = "Test tier (docs/functional-testing.md)"
default = "functional"
options = ["functional"]

[[stacks.rust.suites]]
id = "functional"
profile = "functional"
run_ignored = "default"
# One job of 1096 PTY tests was cancelled at the 15-minute limit
# (run 41781135706). Eight hash shards run at once. test_threads 8
# fills the pty group (max-threads 8, each test threads-required 2).
partitions = 8
build = "inline"
timeout_minutes = 15
test_threads = 8
triggers = ["pull_request", "push", "workflow_dispatch"]
required = true
dispatch_inputs = { tier = ["functional"] }
artifacts = [{ name = "functional-terminal-evidence", paths = ["target/functional", "target/nextest/functional"], when = "always", retention_days = 14 }]
